<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritten & Afspraken Planner</title>
    <!-- jsPDF bibliotheek voor het genereren van PDF's -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; cursor: pointer; }
        .tab { flex: 1; padding: 10px; text-align: center; font-weight: bold; font-size: 14px; color: #666; background: #f8f9fa; border: 1px solid #ddd; border-bottom: none; }
        .tab.active { background: white; color: #007bff; border-top: 3px solid #007bff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        textarea { resize: vertical; height: 60px; }
        .card { padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .card-start { background: #eef9f1; border: 1px solid #c3e6cb; }
        .card-extra { background: #e8f7f9; border: 1px solid #b8daff; }
        .card-stop { background: #fde8e8; border: 1px solid #f5c6cb; }
        button { width: 100%; padding: 12px; font-size: 15px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; }
        .btn-start { background-color: #28a745; }
        .btn-stop { background-color: #dc3545; }
        .btn-extra { background-color: #17a2b8; }
        .btn-add { background-color: #007bff; width: auto; padding: 10px 15px; }
        .btn-save { background-color: #6f42c1; font-size: 18px; padding: 15px; margin-top: 15px; }
        .btn-pdf { background-color: #dc3545; font-size: 16px; padding: 12px; margin-bottom: 15px; }
        .btn-edit { background-color: #ffc107; color: #333; padding: 6px 10px; font-size: 13px; width: auto; }
        .btn-del { background-color: #dc3545; padding: 6px 10px; font-size: 13px; width: auto; }
        .btn-done { background-color: #28a745; color: white; padding: 6px 10px; font-size: 13px; width: auto; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; color: #333; white-space: pre-line; }
        .rit-item { background: #fff; border: 1px solid #ddd; border-left: 5px solid #007bff; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
        .rit-item.vandaag { border-left-color: #28a745; background: #f4faf5; }
        .rit-item.historie { border-left-color: #6c757d; background: #f8f9fa; opacity: 0.9; }
        .rit-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; font-size: 16px; color: #007bff; }
        .rit-details { font-size: 14px; color: #444; margin-bottom: 10px; line-height: 1.5; }
        .rit-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); overflow: auto; }
        .modal-content { background-color: white; margin: 5% auto; padding: 20px; border-radius: 12px; max-width: 500px; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div id="tabForm" class="tab active" onclick="wisselTab('formTab', this)">Nieuwe Rit</div>
        <div id="tabOverzicht" class="tab" onclick="wisselTab('overzichtTab', this); laadOverzicht();">Overzicht</div>
        <div id="tabHistorie" class="tab" onclick="wisselTab('historieTab', this); laadHistorie();">Historie</div>
    </div>

    <!-- TAB 1: FORMULIER -->
    <div id="formTab" class="tab-content active">
        <h2>Nieuwe Rit Inplannen</h2>

        <div class="form-group">
            <label>Bedrijf:</label>
            <div style="display: flex; gap: 5px;">
                <select id="bedrijfSelect">
                    <option value="">-- Kies een bedrijf --</option>
                    <option value="Bedrijf A">Bedrijf A</option>
                    <option value="Bedrijf B">Bedrijf B</option>
                </select>
                <button type="button" class="btn-add" onclick="voegBedrijfToe('bedrijfSelect')">+</button>
            </div>
        </div>

        <div class="form-group">
            <label>Afspraak Datum & Tijd (Gepland):</label>
            <input type="datetime-local" id="afspraakDatumTijd">
        </div>

        <div class="card card-start">
            <label>Start & Haal Adres:</label>
            <input type="text" id="startDatumTijd" placeholder="Starttijd" readonly>
            <input type="text" id="haalAdres" placeholder="Haal Adres (GPS)" style="margin-top: 5px;">
            <button type="button" class="btn-start" onclick="actieStart()">▶ START LOCATIE & TIJD PAKKEN</button>
        </div>

        <div id="extraAdressenContainer"></div>
        
        <button type="button" class="btn-extra" onclick="voegExtraAdresToe()" style="margin-bottom: 15px;">
            ➕ Extra adres / tussenstop toevoegen
        </button>

        <div class="card card-stop">
            <label>Stop & Breng Adres:</label>
            <input type="text" id="stopDatumTijd" placeholder="Stoptijd" readonly>
            <input type="text" id="brengAdres" placeholder="Breng Adres (GPS)" style="margin-top: 5px;">
            <button type="button" class="btn-stop" onclick="actieStop()">⏹ STOP LOCATIE & TIJD PAKKEN</button>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Herhaling:</label>
                <select id="herhaling">
                    <option value="Geen">Geen</option>
                    <option value="Dagelijks">Dagelijks</option>
                    <option value="Om de dag">Om de dag</option>
                    <option value="Ma-Wo-Vr">Ma - Wo - Vr</option>
                    <option value="Di-Do-Za">Di - Do - Za</option>
                </select>
            </div>
            <div class="form-group">
                <label>Einddatum Herhaling:</label>
                <input type="date" id="eindDatumHerhaling">
            </div>
        </div>

        <div class="form-group">
            <label>Opmerkingen:</label>
            <textarea id="opmerkingen" placeholder="Eventuele bijzonderheden..."></textarea>
        </div>

        <button type="button" class="btn-save" onclick="opslaanNieuweRit()">💾 OPSLAAN IN GOOGLE SHEETS</button>
        <div id="status"></div>
    </div>

    <!-- TAB 2: OVERZICHT -->
    <div id="overzichtTab" class="tab-content">
        <h2>Actieve Ritten</h2>
        <div id="rittenLijst">Gegevens ophalen...</div>
    </div>

    <!-- TAB 3: HISTORIE -->
    <div id="historieTab" class="tab-content">
        <h2>Voltooide Ritten (Historie)</h2>

        <!-- Periode selectie voor PDF -->
        <div class="card" style="background: #e9ecef; border: 1px solid #ced4da;">
            <label style="margin-bottom: 8px; color: #333;">Selecteer Periode voor PDF:</label>
            <div class="row">
                <div class="form-group" style="margin-bottom: 8px;">
                    <label style="font-size: 12px;">Van:</label>
                    <input type="date" id="pdfStartDatum">
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label style="font-size: 12px;">Tot:</label>
                    <input type="date" id="pdfEindDatum">
                </div>
            </div>
            <button type="button" class="btn-pdf" onclick="genereerPDF()">📥 Exporteer Historie als PDF</button>
        </div>

        <div id="historieLijst">Historie ophalen...</div>
    </div>
</div>

<!-- BEWERK MODAL -->
<div id="bewerkModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="sluitModal()">&times;</span>
        <h3 style="margin-top:0;">Rit Bewerken</h3>
        <input type="hidden" id="editRowIndex">

        <div class="form-group">
            <label>Bedrijf:</label>
            <input type="text" id="editBedrijf">
        </div>

        <div class="card card-start">
            <label>Start & Haal Adres:</label>
            <input type="text" id="editStartDatumTijd" placeholder="Starttijd" readonly>
            <input type="text" id="editHaalAdres" placeholder="Haal Adres" style="margin-top: 5px;">
            <button type="button" class="btn-start" onclick="actieEditStart()">▶ START TIJD & ADRES PAKKEN</button>
        </div>

        <div class="card card-extra">
            <label>Tussenstop / Extra Adres:</label>
            <input type="text" id="editExtraDatumTijd" placeholder="Tussenstoptijd" readonly>
            <input type="text" id="editExtraAdres" placeholder="Extra Adres" style="margin-top: 5px;">
            <button type="button" class="btn-extra" onclick="actieEditExtra()">📍 TUSSENSTOP TIJD & ADRES PAKKEN</button>
        </div>

        <div class="card card-stop">
            <label>Stop & Breng Adres:</label>
            <input type="text" id="editStopDatumTijd" placeholder="Stoptijd" readonly>
            <input type="text" id="editBrengAdres" placeholder="Breng Adres" style="margin-top: 5px;">
            <button type="button" class="btn-stop" onclick="actieEditStop()">⏹ STOP TIJD & ADRES PAKKEN</button>
        </div>

        <div class="form-group">
            <label>Opmerkingen:</label>
            <textarea id="editOpmerkingen"></textarea>
        </div>

        <button type="button" class="btn-save" style="background-color: #007bff; margin-top: 10px;" onclick="opslaanBewerking()">BIJWERKEN</button>
    </div>
</div>

<script>
    const webhookUrl = 'https://script.google.com/macros/s/AKfycbzgds2s1CVu61suyGbl7bT9OWd8QbJchr-tKEKJG3UMOkl1gAdpYkPLLrwOW_qIUv0Q/exec';
    let extraAdresTeller = 0;
    let globaleRittenData = [];
    let voltooideCache = [];

    function wisselTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    function voegBedrijfToe(selectId) {
        const nieuwBedrijf = prompt("Voer de naam van het nieuwe bedrijf in:");
        if (nieuwBedrijf && nieuwBedrijf.trim() !== "") {
            const select = document.getElementById(selectId);
            const option = document.createElement('option');
            option.value = nieuwBedrijf.trim();
            option.text = nieuwBedrijf.trim();
            option.selected = true;
            select.add(option);
        }
    }

    function haalGPSAdresOp() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ adres: "Geolocatie niet ondersteund" });
                return;
            }
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await res.json();
                    resolve({ adres: data.display_name || "Adres onbekend" });
                } catch (e) {
                    resolve({ adres: "Kon adres niet ophalen" });
                }
            }, () => resolve({ adres: "Locatie niet toegestaan" }), { enableHighAccuracy: true, timeout: 10000 });
        });
    }

    function getNuFormatted() {
        const d = new Date();
        return d.toLocaleDateString('nl-NL') + ' ' + d.toLocaleTimeString('nl-NL');
    }

    function meesFormattedDatum(isoStr) {
        if (!isoStr) return '-';
        try {
            const d = new Date(isoStr);
            if (isNaN(d.getTime())) return isoStr;
            const dag = String(d.getDate()).padStart(2, '0');
            const maand = String(d.getMonth() + 1).padStart(2, '0');
            const jaar = d.getFullYear();
            const uur = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return isoStr.includes('T') && !isoStr.endsWith('00:00:00.000Z') ? `${dag}-${maand}-${jaar} ${uur}:${min}` : `${dag}-${maand}-${jaar}`;
        } catch (e) { return isoStr; }
    }

    async function actieStart() {
        document.getElementById('startDatumTijd').value = getNuFormatted();
        const loc = await haalGPSAdresOp();
        document.getElementById('haalAdres').value = loc.adres;
    }

    async function actieStop() {
        document.getElementById('stopDatumTijd').value = getNuFormatted();
        const loc = await haalGPSAdresOp();
        document.getElementById('brengAdres').value = loc.adres;
    }

    function voegExtraAdresToe() {
        extraAdresTeller++;
        const id = extraAdresTeller;
        const container = document.getElementById('extraAdressenContainer');
        const card = document.createElement('div');
        card.className = 'card card-extra';
        card.id = `extraCard_${id}`;
        card.innerHTML = `
            <label>Extra Adres #${id}:</label>
            <input type="text" id="extraTijd_${id}" placeholder="Tussenstoptijd" readonly>
            <input type="text" id="extraAdres_${id}" placeholder="Extra Adres (GPS)" style="margin-top: 5px;">
            <button type="button" class="btn-extra" onclick="bepaalExtraGPS(${id})">📍 LOCATIE & TIJD PAKKEN</button>
        `;
        container.appendChild(card);
        bepaalExtraGPS(id);
    }

    async function bepaalExtraGPS(id) {
        document.getElementById(`extraTijd_${id}`).value = getNuFormatted();
        const loc = await haalGPSAdresOp();
        document.getElementById(`extraAdres_${id}`).value = loc.adres;
    }

    async function actieEditStart() {
        document.getElementById('editStartDatumTijd').value = getNuFormatted();
        const loc = await haalGPSAdresOp();
        document.getElementById('editHaalAdres').value = loc.adres;
    }

    async function actieEditExtra() {
        document.getElementById('editExtraDatumTijd').value = getNuFormatted();
        const loc = await haalGPSAdresOp();
        document.getElementById('editExtraAdres').value = loc.adres;
    }

    async function actieEditStop() {
        document.getElementById('editStopDatumTijd').value = getNuFormatted();
        const loc = await haalGPSAdresOp();
        document.getElementById('editBrengAdres').value = loc.adres;
    }

    async function verstuurDataForm(formDataObj) {
        const bodyData = new URLSearchParams(formDataObj);
        await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: bodyData.toString()
        });
    }

    async function opslaanNieuweRit() {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Gegevens opslaan...";

        let extraLijst = [];
        for (let i = 1; i <= extraAdresTeller; i++) {
            const t = document.getElementById(`extraTijd_${i}`)?.value || '';
            const a = document.getElementById(`extraAdres_${i}`)?.value || '';
            if (a || t) extraLijst.push(`${t} - ${a}`);
        }

        const payload = {
            status: 'Actief',
            bedrijf: document.getElementById('bedrijfSelect').value,
            afspraakDatumTijd: document.getElementById('afspraakDatumTijd').value,
            startDatumTijd: document.getElementById('startDatumTijd').value,
            haalAdres: document.getElementById('haalAdres').value,
            extraAdressen: extraLijst.join(' | '),
            stopDatumTijd: document.getElementById('stopDatumTijd').value,
            brengAdres: document.getElementById('brengAdres').value,
            herhaling: document.getElementById('herhaling').value,
            eindDatumHerhaling: document.getElementById('eindDatumHerhaling').value,
            opmerkingen: document.getElementById('opmerkingen').value
        };

        try {
            await verstuurDataForm(payload);
            statusDiv.innerText = "✅ Succesvol opgeslagen!";
        } catch (e) {
            statusDiv.innerText = "❌ Fout: " + e.message;
        }
    }

    async function laadOverzicht() {
        const lijstDiv = document.getElementById('rittenLijst');
        lijstDiv.innerText = "Laden...";

        try {
            const res = await fetch(webhookUrl);
            globaleRittenData = await res.json();

            const actieveRitten = globaleRittenData.filter(rit => rit.status !== 'Voltooid');

            if (actieveRitten.length === 0) {
                lijstDiv.innerText = "Geen actieve ritten gevonden.";
                return;
            }

            const vandaagStr = new Date().toISOString().split('T')[0];
            actieveRitten.sort((a, b) => {
                let datumA = a.afspraakDatumTijd ? a.afspraakDatumTijd.split('T')[0] : '9999-99-99';
                let datumB = b.afspraakDatumTijd ? b.afspraakDatumTijd.split('T')[0] : '9999-99-99';
                return datumA.localeCompare(datumB);
            });

            let html = '';
            actieveRitten.forEach((rit) => {
                let isVandaag = rit.afspraakDatumTijd && rit.afspraakDatumTijd.startsWith(vandaagStr);
                let klasse = isVandaag ? 'rit-item vandaag' : 'rit-item';
                let netDatum = meesFormattedDatum(rit.afspraakDatumTijd);

                html += `
                    <div class="${klasse}">
                        <div class="rit-header">
                            <span>🏢 Bedrijf: ${rit.bedrijf || 'Geen bedrijf opgegeven'}</span>
                            <span>📅 ${netDatum}</span>
                        </div>
                        <div class="rit-details">
                            <b>Start:</b> ${rit.startDatumTijd || '-'} | ${rit.haalAdres || '-'}<br>
                            <b>Extra:</b> ${rit.extraAdressen || '-'}<br>
                            <b>Stop:</b> ${rit.stopDatumTijd || '-'} | ${rit.brengAdres || '-'}<br>
                            <b>Notitie:</b> ${rit.opmerkingen || '-'}
                        </div>
                        <div class="rit-actions">
                            <button class="btn-done" onclick="markeerAlsVoltooid(${rit.rowIndex})">🏁 Afronden</button>
                            <button class="btn-edit" onclick="openBewerkModalDoorIndex(${rit.rowIndex})">Bewerken</button>
                            <button class="btn-del" onclick="verwijderRit(${rit.rowIndex})">Delete</button>
                        </div>
                    </div>
                `;
            });
            lijstDiv.innerHTML = html;
        } catch (e) {
            lijstDiv.innerText = "Fout bij laden overzicht: " + e.message;
        }
    }

    async function laadHistorie() {
        const lijstDiv = document.getElementById('historieLijst');
        lijstDiv.innerText = "Historie laden...";

        try {
            const res = await fetch(webhookUrl);
            const alleRitten = await res.json();

            voltooideCache = alleRitten.filter(rit => rit.status === 'Voltooid');

            if (voltooideCache.length === 0) {
                lijstDiv.innerText = "Geen voltooide ritten in de historie.";
                return;
            }

            let html = '';
            voltooideCache.forEach((rit) => {
                let netDatum = meesFormattedDatum(rit.afspraakDatumTijd);
                html += `
                    <div class="rit-item historie">
                        <div class="rit-header">
                            <span>🏢 Bedrijf: ${rit.bedrijf || 'Geen bedrijf opgegeven'}</span>
                            <span>📅 ${netDatum}</span>
                        </div>
                        <div class="rit-details">
                            <b>Start:</b> ${rit.startDatumTijd || '-'} | ${rit.haalAdres || '-'}<br>
                            <b>Extra:</b> ${rit.extraAdressen || '-'}<br>
                            <b>Stop:</b> ${rit.stopDatumTijd || '-'} | ${rit.brengAdres || '-'}<br>
                            <b>Notitie:</b> ${rit.opmerkingen || '-'}
                        </div>
                        <div class="rit-actions">
                            <button class="btn-del" onclick="verwijderRit(${rit.rowIndex})">Delete</button>
                        </div>
                    </div>
                `;
            });
            lijstDiv.innerHTML = html;
        } catch (e) {
            lijstDiv.innerText = "Fout bij laden historie: " + e.message;
        }
    }

    function genereerPDF() {
        const startVal = document.getElementById('pdfStartDatum').value;
        const eindVal = document.getElementById('pdfEindDatum').value;

        if (!startVal || !eindVal) {
            alert("Selecteer eerst een 'Van' en 'Tot' datum voor de periode.");
            return;
        }

        const startDate = new Date(startVal);
        startDate.setHours(0,0,0,0);
        const endDate = new Date(eindVal);
        endDate.setHours(23,59,59,999);

        const gefilterd = voltooideCache.filter(rit => {
            if (!rit.afspraakDatumTijd) return false;
            const ritDatum = new Date(rit.afspraakDatumTijd);
            return ritDatum >= startDate && ritDatum <= endDate;
        });

        if (gefilterd.length === 0) {
            alert("Geen voltooide ritten gevonden in de geselecteerde periode.");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("Ritten Historie Overzicht", 14, 20);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        doc.text(`Periode: ${startVal} t/m ${eindVal}`, 14, 28);
        doc.text(`Totaal aantal ritten: ${gefilterd.length}`, 14, 34);

        let y = 45;
        gefilterd.forEach((rit, index) => {
            if (y > 270) {
                doc.addPage();
                y = 20;
            }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.text(`${index + 1}. Bedrijf: ${rit.bedrijf || 'Geen bedrijf'}`, 14, y);
            
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Gepland: ${meesFormattedDatum(rit.afspraakDatumTijd)}`, 14, y + 6);
            doc.text(`Start: ${rit.startDatumTijd || '-'} | ${rit.haalAdres || '-'}`, 14, y + 12);
            doc.text(`Extra: ${rit.extraAdressen || '-'}`, 14, y + 18);
            doc.text(`Stop: ${rit.stopDatumTijd || '-'} | ${rit.brengAdres || '-'}`, 14, y + 24);
            doc.text(`Notitie: ${rit.opmerkingen || '-'}`, 14, y + 30);

            doc.setDrawColor(200, 200, 200);
            doc.line(14, y + 34, 196, y + 34);

            y += 42;
        });

        doc.save(`Ritten_Historie_${startVal}_tot_${eindVal}.pdf`);
    }

    function openBewerkModalDoorIndex(rowIndex) {
        const rit = globaleRittenData.find(r => r.rowIndex === rowIndex);
        if (!rit) return;

        document.getElementById('editRowIndex').value = rit.rowIndex;
        document.getElementById('editBedrijf').value = rit.bedrijf || '';
        document.getElementById('editStartDatumTijd').value = rit.startDatumTijd || '';
        document.getElementById('editHaalAdres').value = rit.haalAdres || '';
        document.getElementById('editExtraAdres').value = rit.extraAdressen || '';
        document.getElementById('editStopDatumTijd').value = rit.stopDatumTijd || '';
        document.getElementById('editBrengAdres').value = rit.brengAdres || '';
        document.getElementById('editOpmerkingen').value = rit.opmerkingen || '';
        document.getElementById('bewerkModal').style.display = 'block';
    }

    function sluitModal() {
        document.getElementById('bewerkModal').style.display = 'none';
    }

    async function opslaanBewerking() {
        let extraTekst = document.getElementById('editExtraAdres').value;
        const extraTijd = document.getElementById('editExtraDatumTijd').value;
        if (extraTijd && !extraTekst.includes(extraTijd)) {
            extraTekst = `${extraTijd} - ${extraTekst}`;
        }

        const payload = {
            actie: 'UPDATE',
            rowIndex: document.getElementById('editRowIndex').value,
            bedrijf: document.getElementById('editBedrijf').value,
            startDatumTijd: document.getElementById('editStartDatumTijd').value,
            haalAdres: document.getElementById('editHaalAdres').value,
            extraAdressen: extraTekst,
            stopDatumTijd: document.getElementById('editStopDatumTijd').value,
            brengAdres: document.getElementById('editBrengAdres').value,
            opmerkingen: document.getElementById('editOpmerkingen').value
        };

        sluitModal();
        document.getElementById('rittenLijst').innerText = "Bijwerken...";
        await verstuurDataForm(payload);
        setTimeout(() => { laadOverzicht(); }, 1000);
    }

    async function markeerAlsVoltooid(rowIndex) {
        const payload = {
            actie: 'STATUS',
            rowIndex: rowIndex,
            status: 'Voltooid'
        };
        await verstuurDataForm(payload);
        laadOverzicht();
    }

    async function verwijderRit(rowIndex) {
        if (!confirm("Weet je zeker dat je deze rit wilt verwijderen?")) return;
        await verstuurDataForm({ actie: 'DELETE', rowIndex: rowIndex });
        laadOverzicht();
        if(document.getElementById('historieTab').classList.contains('active')) {
            laadHistorie();
        }
    }
</script>

</body>
</html>
