<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritten & Afspraken Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea { resize: vertical; height: 80px; }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { background-color: #218838; }
        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #333;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .form-group { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Rit Inplannen</h2>
    
    <div class="form-group">
        <label>Bedrijf:</label>
        <input type="text" id="bedrijf" placeholder="Naam van het bedrijf">
    </div>

    <div class="form-group">
        <label>Afspraak Datum & Tijd:</label>
        <input type="datetime-local" id="afspraakDatumTijd">
    </div>

    <div class="row">
        <div class="form-group">
            <label>Start Datumtijd:</label>
            <input type="datetime-local" id="startDatumTijd">
        </div>
        <div class="form-group">
            <label>Stop Datumtijd:</label>
            <input type="datetime-local" id="stopDatumTijd">
        </div>
    </div>

    <div class="form-group">
        <label>Haal Adres:</label>
        <input type="text" id="haalAdres" placeholder="Ophaladres">
    </div>

    <div class="form-group">
        <label>Breng Adres:</label>
        <input type="text" id="brengAdres" placeholder="Afleveradres">
    </div>

    <div class="form-group">
        <label>Extra Adres:</label>
        <input type="text" id="extraAdres" placeholder="Eventueel tussenstop / extra adres">
    </div>

    <div class="row">
        <div class="form-group">
            <label>Herhaling:</label>
            <select id="herhaling">
                <option value="Geen">Geen</option>
                <option value="Dagelijkse">Dagelijks</option>
                <option value="Om de dag">Om de dag</option>
                <option value="Ma-Wo-Vr">Ma - Wo - Vr</option>
                <option value="Di-Do-Za">Di - Do - Za</option>
            </select>
        </div>
        <div class="form-group">
            <label>Einddatum Herhaling:</label>
            <input type="date" id="eindDatumHerhaling">
        </div>
    </div>

    <div class="form-group">
        <label>Opmerkingen:</label>
        <textarea id="opmerkingen" placeholder="Eventuele bijzonderheden..."></textarea>
    </div>

    <button onclick="verstuurPlanning()">OPSLAAN / INPLANNEN</button>
    <div id="status"></div>
</div>

<script>
    // Vervang dit door jouw Google Apps Script Web App URL
    const webhookUrl = 'JOUW_GOOGLE_APPS_SCRIPT_URL';

    async function verstuurPlanning() {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Gegevens verzenden...";

        const payload = {
            bedrijf: document.getElementById('bedrijf').value,
            afspraakDatumTijd: document.getElementById('afspraakDatumTijd').value,
            startDatumTijd: document.getElementById('startDatumTijd').value,
            stopDatumTijd: document.getElementById('stopDatumTijd').value,
            haalAdres: document.getElementById('haalAdres').value,
            brengAdres: document.getElementById('brengAdres').value,
            extraAdres: document.getElementById('extraAdres').value,
            herhaling: document.getElementById('herhaling').value,
            eindDatumHerhaling: document.getElementById('eindDatumHerhaling').value,
            opmerkingen: document.getElementById('opmerkingen').value
        };

        try {
            await fetch(webhookUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            statusDiv.innerText = "Succesvol ingepland!";
            // Optioneel formulier legen na verzenden
        } catch (error) {
            statusDiv.innerText = "Fout bij verzenden: " + error.message;
        }
    }
</script>

</body>
</html>
